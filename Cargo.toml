[package]
name = "mypass"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
keepass = { version = "0.15.3", features = ["save_kdbx4"] }
rfd = "0.15"
arboard = "3"
zeroize = "1"
tempfile = "3"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization"] }

[profile.release]
strip = true
lto = "thin"
